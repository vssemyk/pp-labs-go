<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>WebSocket Чат</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 10px;
        }
        #log {
            border: 1px solid #ccc;
            height: 300px;
            overflow-y: auto;
            padding: 10px;
            background: #f9f9f9;
            margin-bottom: 10px;
        }
        .msg {
            margin: 4px 0;
            padding: 4px 8px;
            background: #e0f0ff;
            border-radius: 4px;
        }
        .info {
            color: gray;
            font-style: italic;
        }
        #input-area {
            display: flex;
            gap: 6px;
        }
        #msg-input {
            flex: 1;
            padding: 8px;
        }
        button {
            padding: 8px 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>WebSocket Чат</h2>

    <div id="log"></div>

    <div id="input-area">
        <input type="text" id="msg-input" placeholder="Введите сообщение..." />
        <button onclick="sendMessage()">Отправить</button>
    </div>

    <script>
        const url = "ws://localhost:8081/chat";

        const ws = new WebSocket(url);

        const log = document.getElementById("log");

        function addLine(text, className) {
            const div = document.createElement("div");
            div.className = className || "msg";
            div.textContent = text;
            log.appendChild(div);
            log.scrollTop = log.scrollHeight;
        }

        ws.onopen = function () {
            addLine("Подключено к серверу", "info");
        };

        ws.onmessage = function (event) {
            addLine("Сообщение: " + event.data);
        };

        ws.onclose = function () {
            addLine("Соединение закрыто", "info");
        };

        ws.onerror = function () {
            addLine("Ошибка соединения", "info");
        };

        function sendMessage() {
            const input = document.getElementById("msg-input");
            const text = input.value.trim();
            if (text === "") return;
            if (ws.readyState !== WebSocket.OPEN) {
                addLine("Нет соединения с сервером", "info");
                return;
            }
            ws.send(text);
            input.value = "";
        }

        document.getElementById("msg-input").addEventListener("keydown", function (e) {
            if (e.key === "Enter") sendMessage();
        });
    </script>

</body>
</html>
